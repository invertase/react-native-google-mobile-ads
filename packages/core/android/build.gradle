import io.invertase.gradle.common.PackageJson

buildscript {
  ext.getExtOrDefault = {name, version ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : version
  }

  // The Android Gradle plugin is only required when opening the android folder stand-alone.
  // This avoids unnecessary downloads and potential conflicts when the library is included as a
  // module dependency in an application project.
  if (project == rootProject) {
    repositories {
      google()
      mavenCentral()
    }

    dependencies {
      classpath("com.android.tools.build:gradle:8.6.0")
      classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion', '1.9.25')}"
    }
  } else {
    repositories {
      mavenCentral()
    }

    dependencies {
      classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion', '1.9.25')}"
    }
  }
}

plugins {
  id "io.invertase.gradle.build" version "1.5"
}
apply plugin: 'kotlin-android'

// Google Mobile Ads 25.4 ships Kotlin 2.3 metadata. This module consumes its public Java API,
// so older supported compilers may skip the metadata version check without affecting the app.
def kotlinVersionForCompile = {
  if (rootProject.ext.has('kotlinVersion')) {
    return rootProject.ext.kotlinVersion.toString()
  }
  if (project.hasProperty('KOTLIN_VERSION')) {
    return project.property('KOTLIN_VERSION').toString()
  }
  return getExtOrDefault('kotlinVersion', '1.9.25').toString()
}()

def kotlinVersionParts = kotlinVersionForCompile.tokenize('.').take(2)*.toInteger()
def kotlinMajor = kotlinVersionParts.size() > 0 ? kotlinVersionParts[0] : 0
def kotlinMinor = kotlinVersionParts.size() > 1 ? kotlinVersionParts[1] : 0
def kotlinNeedsAdsMetadataSkip = kotlinMajor < 2 || (kotlinMajor == 2 && kotlinMinor < 3)

if (kotlinNeedsAdsMetadataSkip) {
  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions.freeCompilerArgs += ["-Xskip-metadata-version-check"]
  }
}

def packageJson = PackageJson.getForProject(project)
def googleMobileAdsVersion = packageJson['sdkVersions']['android']['googleMobileAds']
def googleMobileAdsNextGenVersion = packageJson['sdkVersions']['android']['googleMobileAdsNextGen']
def googleUmpVersion = packageJson['sdkVersions']['android']['googleUmp']
def jsonMinSdk = packageJson['sdkVersions']['android']['minSdk']
def jsonTargetSdk = packageJson['sdkVersions']['android']['targetSdk']
def jsonCompileSdk = packageJson['sdkVersions']['android']['compileSdk']
def jsonBuildTools = packageJson['sdkVersions']['android']['buildTools']
def isNewArchitectureDisabled() {
    return project.hasProperty("newArchEnabled") && project.newArchEnabled != "true"
}

def isNewArchitectureEnabled() {
    return !isNewArchitectureDisabled()
}

if (isNewArchitectureDisabled()) {
    throw new GradleException(
      "react-native-google-mobile-ads v17 requires React Native's New Architecture. " +
      "Remove the explicit old-architecture opt-out or set newArchEnabled=true in android/gradle.properties."
    )
}

if (isNewArchitectureEnabled()) {
    apply plugin: "com.facebook.react"
}

project.ext {
  set('react-native', [
    versions: [
      android : [
        minSdk    : jsonMinSdk,
        targetSdk : jsonTargetSdk,
        compileSdk: jsonCompileSdk,
        // optional as gradle.buildTools comes with one by default
        // overriding here though to match the version RN uses
        buildTools: jsonBuildTools
      ],

      googleMobileAds: [
        sdk: googleMobileAdsVersion,
        nextGenSdk: googleMobileAdsNextGenVersion,
      ],

      ads     : [
        consent: googleUmpVersion,
      ],
    ],
  ])
}

apply from: file("./app-json.gradle")

def requestedAndroidBackend = (
  project.findProperty("RNGMA_ANDROID_BACKEND") ?:
    (rootProject.ext.googleMobileAdsJson
      ? rootProject.ext.googleMobileAdsJson.getStringValue("android_sdk", "classic")
      : "classic")
).toString().toLowerCase()

def androidBackend
switch (requestedAndroidBackend) {
  case "classic":
  case "legacy":
    androidBackend = "classic"
    break
  case "nextgen":
    androidBackend = "nextgen"
    break
  default:
    throw new GradleException(
      "Unsupported react-native-google-mobile-ads Android SDK '${requestedAndroidBackend}'. " +
      "Expected 'classic', 'legacy', or 'nextgen'."
    )
}
rootProject.ext.rngmaAndroidBackend = androidBackend
def androidBackendName = androidBackend == "classic" ? "android-classic" : "android-nextgen"

def appJSONGoogleMobileAdsAppIDString = ""
def appJSONGoogleMobileAdsDelayAppMeasurementInitBool = false
def appJSONGoogleMobileAdsOptimizeInitializationBool = true
def appJSONGoogleMobileAdsOptimizeAdLoadingBool = true

if (rootProject.ext.has("googleMobileAdsJson") && rootProject.ext.googleMobileAdsJson) {
  appJSONGoogleMobileAdsAppIDString = rootProject.ext.googleMobileAdsJson.getStringValue("android_app_id", "")
  appJSONGoogleMobileAdsDelayAppMeasurementInitBool = rootProject.ext.googleMobileAdsJson.isFlagEnabled("delay_app_measurement_init", false)
  appJSONGoogleMobileAdsOptimizeInitializationBool = rootProject.ext.googleMobileAdsJson.isFlagEnabled("optimize_initialization", true)
  appJSONGoogleMobileAdsOptimizeAdLoadingBool = rootProject.ext.googleMobileAdsJson.isFlagEnabled("optimize_ad_loading", true)
}

if (!appJSONGoogleMobileAdsAppIDString) {
  println "\n\n\n"
  println "**************************************************************************************************************"
  println "\n\n\n"
  println "WARNING: react-native-google-mobile-ads requires an 'android_app_id' property inside a 'react-native-google-mobile-ads' key in your app.json."
  println "         No android_app_id property was found in this location. The native Google Mobile Ads SDK will crash on startup without it."
  println "         You can safely ignore this warning if you are using our Expo config plugin."
  println "\n\n\n"
  println "**************************************************************************************************************"
  println "\n\n\n"
}

android {
  defaultConfig {
    multiDexEnabled true
    manifestPlaceholders = [
      appJSONGoogleMobileAdsAppID                  : appJSONGoogleMobileAdsAppIDString,
      appJSONGoogleMobileAdsDelayAppMeasurementInit: appJSONGoogleMobileAdsDelayAppMeasurementInitBool,
      appJSONGoogleMobileAdsOptimizeInitialization : appJSONGoogleMobileAdsOptimizeInitializationBool,
      appJSONGoogleMobileAdsOptimizeAdLoading      : appJSONGoogleMobileAdsOptimizeAdLoadingBool
    ]
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    buildConfigField "String", "RNGMA_ANDROID_BACKEND", "\"${androidBackendName}\""

    sourceSets {
      main {
        // GMA-AD-3: package-owned Codegen is committed and must not be regenerated by Gradle.
        java.srcDirs += ['generated/java']
        java.srcDirs += ["src/${androidBackend}/java"]
      }
      test {
        java.srcDirs += ["src/test${androidBackend.capitalize()}/java"]
      }
    }
  }
  lintOptions {
    disable 'GradleCompatible'
    abortOnError false
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
  testOptions {
    unitTests {
      includeAndroidResources = true
      all {
        systemProperty 'robolectric.logging.enabled', 'true'
      }
    }
  }
}

// React Native skips Codegen tasks for includesGeneratedCode, but may still add
// the transient build/generated source directory. Remove that source root so
// stale app builds cannot compile alongside the committed tree.
afterEvaluate {
  def transientCodegen = layout.buildDirectory.dir("generated/source/codegen").get().asFile
  android.sourceSets.main.java.srcDirs = android.sourceSets.main.java.srcDirs.findAll {
    !it.toPath().startsWith(transientCodegen.toPath())
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  if (androidBackend == "classic") {
    implementation("com.google.android.gms:play-services-ads:${ReactNative.ext.getVersion("googleMobileAds", "sdk")}")
  } else {
    implementation("com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:${ReactNative.ext.getVersion("googleMobileAds", "nextGenSdk")}") {
      exclude group: "com.google.android.gms", module: "play-services-ads"
      exclude group: "com.google.android.gms", module: "play-services-ads-lite"
    }
  }
  api "com.google.android.ump:user-messaging-platform:${ReactNative.ext.getVersion("ads", "consent")}"

  testImplementation "junit:junit:4.13.2"
  testImplementation "org.robolectric:robolectric:4.14.1"
}

def versionParts = { String version ->
  version.tokenize('.').collect { part -> part as Integer }
}
def compareVersions = { String left, String right ->
  def leftParts = versionParts(left)
  def rightParts = versionParts(right)
  def length = Math.max(leftParts.size(), rightParts.size())
  for (int index = 0; index < length; index++) {
    def leftPart = index < leftParts.size() ? leftParts[index] : 0
    def rightPart = index < rightParts.size() ? rightParts[index] : 0
    if (leftPart != rightPart) return leftPart <=> rightPart
  }
  return 0
}
if (androidBackend == "nextgen") {
  def explicitUmp = ReactNative.ext.getVersion("ads", "consent").toString()
  def nextGenTransitiveUmp = "4.0.0"
  if (compareVersions(explicitUmp, nextGenTransitiveUmp) < 0) {
    throw new GradleException(
      "react-native-google-mobile-ads requires explicit UMP ${explicitUmp} to be at least " +
      "${nextGenTransitiveUmp} for the Next-Gen Android SDK."
    )
  }
}

ReactNative.shared.applyPackageVersion()
ReactNative.shared.applyDefaultExcludes()
ReactNative.module.applyAndroidVersions()
ReactNative.module.applyReactNativeDependency("api")

