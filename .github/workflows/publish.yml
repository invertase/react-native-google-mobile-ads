name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read # for checkout

jobs:
  publish_npm:
    if: "(github.repository == 'invertase/react-native-google-mobile-ads') && (github.event_name == 'workflow_dispatch')"
    name: 'NPM'
    # Darwin + Xcode: semantic-release prepare refreshes RNGoogleMobileAdsExample/ios/Podfile.lock
    timeout-minutes: 60
    runs-on: macos-15
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # Required for NPM OIDC Trusted Publish + Provenance
    env:
      XCODE_VERSION: latest-stable
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3
      - name: Bundle Install
        uses: nick-fields/retry@v3
        # Gemfile.lock's `BUNDLED WITH` version is the Bundler pin; frozen mode
        # makes the root lock authoritative without a separate gem install path.
        with:
          timeout_minutes: 15
          retry_wait_seconds: 60
          max_attempts: 3
          command: BUNDLE_FROZEN=true bundle install
      - name: Yarn Install
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          retry_wait_seconds: 60
          max_attempts: 3
          command: yarn
      - name: Record Release
        run: yarn semantic-release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          # `npm version` (run per pkgRoot by @semantic-release/npm) otherwise
          # relinks every workspace, and npm cannot parse Yarn's `workspace:`
          # and `portal:` protocols. Only the version field needs writing here.
          npm_config_workspaces_update: 'false'
      # Only npm uploader. A rerun heals partial uploads because a no-op
      # semantic-release still exits 0 once git is already at version V; a failed
      # release (bumped manifests, no tag) must not reach npm.
      - name: Publish Missing Packages
        if: success()
        run: yarn lerna publish from-package --yes --loglevel trace

  deploy-api-reference:
    name: Deploy API Reference
    needs: publish_npm
    uses: ./.github/workflows/deploy-api-reference.yml
    permissions:
      contents: read
      pages: write
      id-token: write
