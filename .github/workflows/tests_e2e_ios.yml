name: Testing E2E iOS

on:
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '.spellcheck.dict.txt'
      - '**/*.md'

  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '.spellcheck.dict.txt'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS
    runs-on: macos-15
    # TODO matrix across APIs, at least 10 and 13 (lowest to highest)
    timeout-minutes: 60
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      # Set up tool versions
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          fetch-depth: 50

      # Set path variables needed for caches
      - name: Set workflow variables
        id: workflow-variables
        run: |
          echo "metro-cache=$HOME/.metro" >> $GITHUB_OUTPUT
          echo "xcode-version=$(xcodebuild -version|tail -1|cut -f3 -d' ')" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Yarn Cache
        id: yarn-cache
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('package.json', 'yarn.lock', 'packages/core/package.json', 'RNGoogleMobileAdsExample/package.json') }}
          restore-keys: ${{ runner.os }}-yarn-v1

      # Native iOS deps compile during yarn/pod install; set up Xcode compile cache first
      - uses: hendrikmuhs/ccache-action@v1
        name: Xcode Compile Cache
        with:
          key: ${{ runner.os }}-v2 # makes a unique key w/related restore key internally
          create-symlink: true
          max-size: 750M

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3

      - name: Bundle Install
        uses: nick-fields/retry@v3
        # Gemfile.lock's `BUNDLED WITH` version is the Bundler pin; frozen mode
        # makes the root lock authoritative without a separate gem install path.
        with:
          timeout_minutes: 10
          retry_wait_seconds: 60
          max_attempts: 3
          command: BUNDLE_FROZEN=true bundle install

      - uses: actions/cache@v4
        name: Cache Pods
        id: pods-cache
        with:
          path: RNGoogleMobileAdsExample/ios/Pods
          key: ${{ runner.os }}-pods-v2-${{ hashFiles('RNGoogleMobileAdsExample/ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-v2

      - name: Yarn Install
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          retry_wait_seconds: 60
          max_attempts: 3
          command: yarn

      - name: Pod Install
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          retry_wait_seconds: 30
          max_attempts: 3
          command: yarn tests:ios:pod:install

      - name: Metro Bundler Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.workflow-variables.outputs.metro-cache }}
          key: ${{ runner.os }}-metro-v1-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-metro-v1

      - name: Pre-fetch Javascript bundle
        run: |
          nohup yarn tests:packager &
          printf 'Waiting for packager to come online'
          until curl --output /dev/null --silent --head --fail http://localhost:8081/status; do
            printf '.'
            sleep 2
          done
          echo "Packager is online! Preparing bundle..."
          curl --output /dev/null --silent --head --fail "http://localhost:8081/index.bundle?platform=ios&dev=true&minify=false&inlineSourceMap=true"
          echo "...javascript bundle ready"

      - name: Select and boot simulator
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          retry_wait_seconds: 30
          max_attempts: 3
          command: yarn tests:appium:ios:select-and-boot --github-env "$GITHUB_ENV"

      - name: Create Simulator Log
        continue-on-error: true
        run: nohup xcrun simctl spawn "$RNGMA_IOS_UDID" log stream --level debug --style compact > simulator.log 2>&1 &

      - name: Install example on simulator
        timeout-minutes: 20
        run: yarn tests:ios:run --udid "$RNGMA_IOS_UDID"

      - name: Install Appium drivers and prebuild WDA
        timeout-minutes: 15
        run: |
          yarn tests:appium:drivers:install
          yarn tests:appium:drivers:verify
          yarn tests:appium:ios:prebuild-wda

      # In-process session-create hang recovery/abort (WDIO onAbort hard marker +
      # serial preflight) is the retry surface — do not wrap this step in
      # nick-fields/retry, which would also re-run product failures.
      - name: Run Appium e2e
        timeout-minutes: 30
        run: |
          export RNGMA_WDA_PREBUILT=1
          yarn tests:appium:ios

      - name: Upload Simulator Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator_log
          path: simulator.log

      # WDA DerivedData + xcodebuild logs for session-create exit-65 triage.
      # showXcodeLog streams build stderr into the job log; these files capture
      # anything Xcode wrote under the shared prebuild derivedDataPath.
      - name: Upload WDA xcodebuild logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wda_xcodebuild_logs
          path: |
            tooling/appium/.wda-derived/Logs
            tooling/appium/.wda-derived/hang-recover-snapshots
            tooling/appium/.wda-derived/**/*.log
            tooling/appium/.wda-derived/**/*.xcactivitylog
            tooling/appium/.wda-derived/**/*.xcresult
          if-no-files-found: warn

      - uses: codecov/codecov-action@v5
        with:
          verbose: true
