name: Testing E2E iOS

on:
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '.spellcheck.dict.txt'
      - '**/*.md'

  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '.spellcheck.dict.txt'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS
    runs-on: macos-15
    # TODO matrix across APIs, at least 10 and 13 (lowest to highest)
    # 90m: setup (~25–35m) + three serial Appium shards with remount budgets;
    # 60m cancelled mid tertiary after a-primary/b-secondary (run 38780622785).
    timeout-minutes: 90
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      # Prefer PATH ccache wrappers from ccache-action (create-symlink). Do not set LD/LDPLUSPLUS (Xcode 27 trap).
      CCACHE_SLOPPINESS: clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
    steps:
      # Set up tool versions
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          fetch-depth: 50

      # Set path variables needed for caches
      - name: Set workflow variables
        id: workflow-variables
        run: |
          echo "metro-cache=$HOME/.metro" >> $GITHUB_OUTPUT
          echo "xcode-version=$(xcodebuild -version|tail -1|cut -f3 -d' ')" >> $GITHUB_OUTPUT

      - uses: actions/cache/restore@v4
        name: Yarn Cache
        id: yarn-cache
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('package.json', 'yarn.lock', 'packages/core/package.json', 'RNGoogleMobileAdsExample/package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      # Native iOS deps compile during yarn/pod install; set up Xcode compile cache first
      - uses: hendrikmuhs/ccache-action@v1
        name: Xcode Compile Cache
        with:
          # Sticky content-hash key. Single e2e app-id; append-timestamp: false.
          key: ${{ runner.os }}-e2e-ios-v1-${{ hashFiles('yarn.lock', 'packages/core/ios/**', 'packages/core/*.podspec', 'RNGoogleMobileAdsExample/ios/Podfile.lock') }}
          append-timestamp: false
          create-symlink: true
          max-size: 750M
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3

      - name: Bundle Install
        uses: nick-fields/retry@v3
        # Gemfile.lock's `BUNDLED WITH` version is the Bundler pin; frozen mode
        # makes the root lock authoritative without a separate gem install path.
        with:
          timeout_minutes: 10
          retry_wait_seconds: 60
          max_attempts: 3
          command: BUNDLE_FROZEN=true bundle install

      - uses: actions/cache/restore@v4
        name: Pods Cache Restore
        id: pods-cache
        with:
          path: RNGoogleMobileAdsExample/ios/Pods
          key: ${{ runner.os }}-pods-v2-${{ hashFiles('RNGoogleMobileAdsExample/ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-v2-

      - name: Yarn Install
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          retry_wait_seconds: 60
          max_attempts: 3
          command: yarn

      - uses: actions/cache/save@v4
        name: Yarn Cache Save
        if: github.ref == 'refs/heads/main' && steps.yarn-cache.outputs.cache-hit != 'true'
        with:
          path: .yarn/cache
          key: ${{ steps.yarn-cache.outputs.cache-primary-key }}

      - name: Pod Install
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          retry_wait_seconds: 30
          max_attempts: 3
          command: yarn tests:ios:pod:install

      - uses: actions/cache/save@v4
        name: Pods Cache Save
        if: github.ref == 'refs/heads/main' && steps.pods-cache.outputs.cache-hit != 'true'
        with:
          path: RNGoogleMobileAdsExample/ios/Pods
          key: ${{ steps.pods-cache.outputs.cache-primary-key }}

      # Sticky content-hash Metro restore/save. Save only on main when miss.
      - uses: actions/cache/restore@v4
        name: Metro Bundler Cache Restore
        id: metro-bundler-cache
        with:
          path: ${{ steps.workflow-variables.outputs.metro-cache }}
          key: ${{ runner.os }}-ios-metro-v2-${{ hashFiles('yarn.lock', 'RNGoogleMobileAdsExample/package.json', 'RNGoogleMobileAdsExample/metro.config.js', 'RNGoogleMobileAdsExample/index.js', 'RNGoogleMobileAdsExample/app.json', 'packages/core/package.json', 'packages/core/lib/**') }}
          restore-keys: ${{ runner.os }}-ios-metro-v2-

      - name: Pre-fetch Javascript bundle
        # Align FileStore root with sticky Metro restore/save path (workflow-variables metro-cache).
        env:
          RNGMA_METRO_CACHE_ROOT: ${{ steps.workflow-variables.outputs.metro-cache }}
        run: |
          nohup yarn tests:packager &
          printf 'Waiting for packager to come online'
          until curl --output /dev/null --silent --head --fail http://localhost:8081/status; do
            printf '.'
            sleep 2
          done
          echo "Packager is online! Preparing bundle..."
          curl --output /dev/null --silent --head --fail "http://localhost:8081/index.bundle?platform=ios&dev=true&minify=false&inlineSourceMap=true"
          echo "...javascript bundle ready"

      - name: Select and boot simulator
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          retry_wait_seconds: 30
          max_attempts: 3
          command: yarn tests:appium:ios:select-and-boot --github-env "$GITHUB_ENV"

      - name: Create Simulator Log
        continue-on-error: true
        run: nohup xcrun simctl spawn "$RNGMA_IOS_UDID" log stream --level debug --style compact > simulator.log 2>&1 &

      - name: ccache stats (before)
        run: ccache -s || true

      # 25m: cold xcodebuild can take ~14m; script time-boxes simctl install/launch
      # (~90s each) so a launch hang fails fast instead of burning the step wall.
      - name: Install example on simulator
        timeout-minutes: 25
        run: |
          echo "[ios-run] workflow step start"
          yarn tests:ios:run --udid "$RNGMA_IOS_UDID"
          echo "[ios-run] workflow step end"

      - name: ccache stats (after)
        if: always()
        run: ccache -s || true

      - name: Install Appium drivers and prebuild WDA
        timeout-minutes: 15
        run: |
          yarn tests:appium:drivers:install
          yarn tests:appium:drivers:verify
          yarn tests:appium:ios:prebuild-wda

      # In-process session-create hang recovery/abort (WDIO onAbort hard marker +
      # serial preflight) is the retry surface — do not wrap this step in
      # nick-fields/retry, which would also re-run product failures.
      - name: Run Appium e2e
        # Must fit three serial shards + remount under the 90m job wall after setup.
        timeout-minutes: 50
        run: |
          export RNGMA_WDA_PREBUILT=1
          yarn tests:appium:ios

      - uses: actions/cache/save@v4
        name: Metro Bundler Cache Save
        if: >
          github.ref == 'refs/heads/main'
          && steps.metro-bundler-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.workflow-variables.outputs.metro-cache }}
          key: ${{ steps.metro-bundler-cache.outputs.cache-primary-key }}

      - name: Upload Simulator Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator_log
          path: simulator.log

      # WDA DerivedData + xcodebuild logs for session-create exit-65 triage.
      # showXcodeLog streams build stderr into the job log; these files capture
      # anything Xcode wrote under the shared prebuild derivedDataPath.
      # include-hidden-files: upload-artifact skips dotdirs by default; without
      # it, sibling `.hang-recover-snapshots` / `.wda-derived` never upload.
      - name: Upload WDA xcodebuild logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wda_xcodebuild_logs
          include-hidden-files: true
          path: |
            tooling/appium/.wda-derived/Logs
            tooling/appium/.hang-recover-snapshots
            tooling/appium/.wda-derived/**/*.log
            tooling/appium/.wda-derived/**/*.xcactivitylog
            tooling/appium/.wda-derived/**/*.xcresult
            tooling/appium/.appium-home/logs
          if-no-files-found: warn

      - uses: codecov/codecov-action@v5
        with:
          verbose: true
