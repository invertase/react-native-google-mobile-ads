name: Testing E2E Android

on:
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '.spellcheck.dict.txt'
      - '**/*.md'

  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '.spellcheck.dict.txt'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (${{ matrix.android-backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      EMULATOR_COMMAND: "-avd TestingAVD -noaudio -gpu swiftshader_indirect -camera-back none -no-snapshot -no-window -no-boot-anim -nojni -memory 2048 -timezone 'Europe/London' -cores 2"
      EMULATOR_EXECUTABLE: qemu-system-x86_64-headless
      # classic | nextgen — drives example Gradle + Appium scripts (Q13.A / NG-5).
      RNGMA_ANDROID_BACKEND: ${{ matrix.android-backend }}
      # Pin RN ABI so Gradle dependency cache stays architecture-scoped.
      ORG_GRADLE_PROJECT_reactNativeArchitectures: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        # Native fill/render validation requires a Play Store-enabled image.
        # google_apis images return SDK internal-error 0 for Native while other formats load.
        api-level: [36]
        arch: [x86_64]
        target: [google_apis_playstore]
        # This is useful for benchmarking, do 0, 1, 2, etc (up to 256 max job-per-matrix limit) for averages
        iteration: [0]
        # Dual Android SDK backends — classic default + Next-Gen opt-in (ads-mobile-sdk).
        android-backend: [classic, nextgen]
    steps:
      - name: Liberate disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v5
        with:
          fetch-depth: 50

      # Set up tool versions
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # Set path variables needed for caches
      - name: Set workflow variables
        id: workflow-variables
        run: |
          echo "metro-cache=$HOME/.metro" >> $GITHUB_OUTPUT
          echo "tempdir=$TMPDIR" >> $GITHUB_OUTPUT

      - uses: actions/cache/restore@v4
        name: Yarn Cache
        id: yarn-cache
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('package.json', 'yarn.lock', 'packages/core/package.json', 'RNGoogleMobileAdsExample/package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Yarn Install
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          retry_wait_seconds: 60
          max_attempts: 3
          command: yarn

      - uses: actions/cache/save@v4
        name: Yarn Cache Save
        if: github.ref == 'refs/heads/main' && steps.yarn-cache.outputs.cache-hit != 'true'
        with:
          path: .yarn/cache
          key: ${{ steps.yarn-cache.outputs.cache-primary-key }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # Only write to the cache for builds on the 'main' branches, stops branches evicting main cache
          # Builds on other branches will only read from main branch cache writes
          # Comment this and the with: above out for performance testing on a branch
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Warm Gradle Cache
        # This makes sure we fetch gradle network resources with a retry.
        # RNGMA_ANDROID_BACKEND from the job env selects classic vs nextgen in Gradle.
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          retry_wait_seconds: 60
          max_attempts: 3
          command: yarn tests:android:build

      # Sticky content-hash Metro restore. Both backends restore the same key;
      # only classic + iteration 0 on main saves.
      - uses: actions/cache/restore@v4
        name: Metro Bundler Cache Restore
        id: metro-bundler-cache
        with:
          path: ${{ steps.workflow-variables.outputs.metro-cache }}
          key: ${{ runner.os }}-android-metro-v2-${{ hashFiles('yarn.lock', 'RNGoogleMobileAdsExample/package.json', 'RNGoogleMobileAdsExample/metro.config.js', 'RNGoogleMobileAdsExample/index.js', 'RNGoogleMobileAdsExample/app.json', 'packages/core/package.json', 'packages/core/lib/**') }}
          restore-keys: ${{ runner.os }}-android-metro-v2-

      - name: Pre-fetch Javascript bundle
        # Prebuild the bundle so that's fast when the app starts.
        # Align FileStore root with sticky Metro restore/save path (workflow-variables metro-cache).
        env:
          RNGMA_METRO_CACHE_ROOT: ${{ steps.workflow-variables.outputs.metro-cache }}
        run: |
          nohup yarn tests:packager &
          printf 'Waiting for packager to come online'
          until curl --output /dev/null --silent --head --fail http://localhost:8081/status; do
            printf '.'
            sleep 2
          done
          echo "Packager is online! Preparing javascript bundle..."
          curl --output /dev/null --silent --head --fail "http://localhost:8081/index.bundle?platform=android&dev=true&minify=false&inlineSourceMap=true"
          echo "...javascript bundle ready."

      - name: Run Emulator Tests
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 30
        with:
          api-level: ${{ matrix.api-level }}
          avd-name: TestingAVD
          force-avd-creation: false
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          sdcard-path-or-size: 100M
          disable-animations: true
          script: |
            $ANDROID_HOME/platform-tools/adb logcat '*:D' > adb-log.txt &
            yarn tests:appium:drivers:install
            yarn tests:appium:drivers:verify
            yarn tests:appium:android

      - uses: actions/cache/save@v4
        name: Metro Bundler Cache Save
        if: >
          github.ref == 'refs/heads/main'
          && matrix.iteration == 0
          && matrix.android-backend == 'classic'
          && steps.metro-bundler-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.workflow-variables.outputs.metro-cache }}
          key: ${{ steps.metro-bundler-cache.outputs.cache-primary-key }}

      - uses: codecov/codecov-action@v5
        with:
          verbose: true

      - name: Upload Emulator Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adb_logs-${{ matrix.android-backend }}-${{ matrix.api-level }}-${{ matrix.arch }}-${{ matrix.iteration }}
          path: adb-log.txt
