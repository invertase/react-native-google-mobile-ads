name: Documentation

on:
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  route-linux:
    uses: ./.github/workflows/mellifera-route.yml
    secrets: inherit
    with:
      class: other
      default-runs-on: ubuntu-latest
  spelling:
    name: 'Spelling & Docs links'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Yarn Cache
        id: yarn-cache
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('package.json', 'yarn.lock', 'packages/core/package.json', 'RNGoogleMobileAdsExample/package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Yarn Install
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          retry_wait_seconds: 60
          max_attempts: 3
          command: yarn
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Yarn Cache Save
        if: github.ref == 'refs/heads/main' && steps.yarn-cache.outputs.cache-hit != 'true'
        with:
          path: .yarn/cache
          key: ${{ steps.yarn-cache.outputs.cache-primary-key }}
      - name: Spell check
        run: |
          yarn lint:spellcheck
      # Cold Invertase/docs.page/rnfirebase origins often need >10s (CLI hardcodes
      # EXTERNAL_LINK_TIMEOUT_MS=10s with no flag). Warm them, then retry the
      # full check with a larger attempt budget — do not severityOverride those hosts.
      - name: Warm cold docs origins
        run: |
          set +e
          for url in \
            https://use.docs.page \
            https://docs.page/invertase/react-native-google-mobile-ads \
            https://rnfirebase.io; do
            echo "warming ${url}"
            curl -sS -o /dev/null -w "%{http_code} %{time_total}s %{url_effective}\n" \
              -L --connect-timeout 20 --max-time 45 "${url}" || true
          done
      - name: Docs.page links
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 20
          retry_wait_seconds: 90
          max_attempts: 5
          command: yarn lint:docs-links

  api-reference:
    name: 'API reference (strict TypeDoc)'
    runs-on: ${{ fromJSON(needs.route-linux.outputs.runs-on) }}
    needs: route-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Yarn Cache
        id: yarn-cache
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('package.json', 'yarn.lock', 'packages/core/package.json', 'RNGoogleMobileAdsExample/package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Yarn Install
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          retry_wait_seconds: 60
          max_attempts: 3
          command: yarn
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Yarn Cache Save
        if: github.ref == 'refs/heads/main' && steps.yarn-cache.outputs.cache-hit != 'true'
        with:
          path: .yarn/cache
          key: ${{ steps.yarn-cache.outputs.cache-primary-key }}
      - name: Build API reference
        run: yarn reference:api
