name: Documentation

on:
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spelling:
    name: 'Spelling & Docs links'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        name: Yarn Cache
        id: yarn-cache
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('package.json', 'yarn.lock', 'packages/core/package.json', 'RNGoogleMobileAdsExample/package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Yarn Install
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          retry_wait_seconds: 60
          max_attempts: 3
          command: yarn
      - uses: actions/cache/save@v4
        name: Yarn Cache Save
        if: github.ref == 'refs/heads/main' && steps.yarn-cache.outputs.cache-hit != 'true'
        with:
          path: .yarn/cache
          key: ${{ steps.yarn-cache.outputs.cache-primary-key }}
      - name: Spell check
        run: |
          yarn lint:spellcheck
      # Cold Invertase/docs.page/rnfirebase origins often need >10s (CLI hardcodes
      # EXTERNAL_LINK_TIMEOUT_MS=10s with no flag). Warm them, then retry the
      # full check with a larger attempt budget. Do not severityOverride those hosts.
      # yarn lint:docs-links also sends Accept: text/html. Those hosts return 500
      # when that header is missing, and retries do not change the header.
      - name: Warm cold docs origins
        run: |
          set +e
          for url in \
            https://use.docs.page \
            https://docs.page/invertase/react-native-google-mobile-ads \
            https://rnfirebase.io; do
            echo "warming ${url}"
            curl -sS -o /dev/null -w "%{http_code} %{time_total}s %{url_effective}\n" \
              -L --connect-timeout 20 --max-time 45 "${url}" || true
          done
      - name: Docs.page links
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          retry_wait_seconds: 90
          max_attempts: 5
          command: yarn lint:docs-links

  api-reference:
    name: 'API reference (strict TypeDoc)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        name: Yarn Cache
        id: yarn-cache
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('package.json', 'yarn.lock', 'packages/core/package.json', 'RNGoogleMobileAdsExample/package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Yarn Install
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          retry_wait_seconds: 60
          max_attempts: 3
          command: yarn
      - uses: actions/cache/save@v4
        name: Yarn Cache Save
        if: github.ref == 'refs/heads/main' && steps.yarn-cache.outputs.cache-hit != 'true'
        with:
          path: .yarn/cache
          key: ${{ steps.yarn-cache.outputs.cache-primary-key }}
      - name: Build API reference
        run: yarn reference:api
