name: Code Quality Checks

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linting:
    name: Lint code
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache/restore@v6
        name: Yarn Cache
        id: yarn-cache
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('package.json', 'yarn.lock', 'packages/core/package.json', 'RNGoogleMobileAdsExample/package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Configure JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # Only write to the cache for builds on main; PRs read-only to avoid cache eviction wars.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Yarn Install
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 3
          retry_wait_seconds: 30
          max_attempts: 3
          command: yarn
      - uses: actions/cache/save@v6
        name: Yarn Cache Save
        if: github.ref == 'refs/heads/main' && steps.yarn-cache.outputs.cache-hit != 'true'
        with:
          path: .yarn/cache
          key: ${{ steps.yarn-cache.outputs.cache-primary-key }}
      - name: Lint
        run: yarn lint:code
      - name: Kotlin lint
        id: kotlin-lint
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          retry_wait_seconds: 45
          max_attempts: 3
          command: ./gradlew ktlintCheck --no-daemon
      - name: Verify committed Codegen
        run: yarn codegen:verify
      - name: Save Code Linting Report JSON
        run: yarn lint:report
        continue-on-error: true
      - name: Detect ESLint findings for PR annotation
        id: eslint-annotate-gate
        if: always()
        run: |
          if [ ! -f eslint-report.json ]; then
            echo "annotate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count="$(jq '[.[].messages[]? | select(.severity >= 1)] | length' eslint-report.json)"
          if [ "${count:-0}" -gt 0 ]; then
            echo "annotate=true" >> "$GITHUB_OUTPUT"
          else
            echo "annotate=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Annotate Code Linting Results
        if: steps.eslint-annotate-gate.outputs.annotate == 'true'
        uses: ataylorme/eslint-annotate-action@4.0.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          report-json: 'eslint-report.json'
      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eslint-report.json
          path: eslint-report.json
          if-no-files-found: ignore

  typescript:
    name: TypeScript Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache/restore@v6
        name: Yarn Cache
        id: yarn-cache
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('package.json', 'yarn.lock', 'packages/core/package.json', 'RNGoogleMobileAdsExample/package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Yarn Install
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 3
          retry_wait_seconds: 30
          max_attempts: 3
          command: yarn
      - uses: actions/cache/save@v6
        name: Yarn Cache Save
        if: github.ref == 'refs/heads/main' && steps.yarn-cache.outputs.cache-hit != 'true'
        with:
          path: .yarn/cache
          key: ${{ steps.yarn-cache.outputs.cache-primary-key }}
      - name: Lint
        run: yarn tsc:compile

