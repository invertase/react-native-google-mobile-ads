name: Code Quality Checks

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route-linting:
    uses: ./.github/workflows/mellifera-route.yml
    secrets: inherit
    with:
      class: other
      default-runs-on: ubuntu-latest
  linting:
    name: Lint code
    timeout-minutes: 15
    runs-on: ${{ fromJSON(needs.route-linting.outputs.runs-on) }}
    needs: route-linting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Yarn Cache
        id: yarn-cache
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('package.json', 'yarn.lock', 'packages/core/package.json', 'RNGoogleMobileAdsExample/package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Configure JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Only write to the cache for builds on main; PRs read-only to avoid cache eviction wars.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Yarn Install
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 3
          retry_wait_seconds: 30
          max_attempts: 3
          command: yarn
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Yarn Cache Save
        if: github.ref == 'refs/heads/main' && steps.yarn-cache.outputs.cache-hit != 'true'
        with:
          path: .yarn/cache
          key: ${{ steps.yarn-cache.outputs.cache-primary-key }}
      - name: Lint
        run: yarn lint:code
      - name: Kotlin lint
        id: kotlin-lint
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          retry_wait_seconds: 45
          max_attempts: 3
          command: ./gradlew ktlintCheck --no-daemon
      - name: Verify committed Codegen
        run: yarn codegen:verify
      - name: Save Code Linting Report JSON
        run: yarn lint:report
        continue-on-error: true
      - name: Detect ESLint findings for PR annotation
        id: eslint-annotate-gate
        if: always()
        run: |
          if [ ! -f eslint-report.json ]; then
            echo "annotate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count="$(jq '[.[].messages[]? | select(.severity >= 1)] | length' eslint-report.json)"
          if [ "${count:-0}" -gt 0 ]; then
            echo "annotate=true" >> "$GITHUB_OUTPUT"
          else
            echo "annotate=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Annotate Code Linting Results
        if: steps.eslint-annotate-gate.outputs.annotate == 'true'
        uses: ataylorme/eslint-annotate-action@5a8d8ab89a57679e90c32750e0f382e9d8570750 # 4.0.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          report-json: 'eslint-report.json'
      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eslint-report.json
          path: eslint-report.json
          if-no-files-found: ignore

  route-typescript:
    uses: ./.github/workflows/mellifera-route.yml
    secrets: inherit
    with:
      class: other
      default-runs-on: ubuntu-latest
  typescript:
    name: TypeScript Build Validation
    runs-on: ${{ fromJSON(needs.route-typescript.outputs.runs-on) }}
    needs: route-typescript
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Yarn Cache
        id: yarn-cache
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('package.json', 'yarn.lock', 'packages/core/package.json', 'RNGoogleMobileAdsExample/package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Yarn Install
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 3
          retry_wait_seconds: 30
          max_attempts: 3
          command: yarn
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Yarn Cache Save
        if: github.ref == 'refs/heads/main' && steps.yarn-cache.outputs.cache-hit != 'true'
        with:
          path: .yarn/cache
          key: ${{ steps.yarn-cache.outputs.cache-primary-key }}
      - name: Lint
        run: yarn tsc:compile

