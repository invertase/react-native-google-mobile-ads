# Example-app ccache config for Xcode/Pods ObjC/C++ compiles.
# Used when CC/CXX point at the sibling wrapper scripts (not RN's broken
# CCACHE_BINARY build-setting path). See RNGoogleMobileAdsExample/ios/ccache/.

sloppiness = clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
file_clone = true
depend_mode = true
inode_cache = true
